[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API, which also serves the statically built frontend"
authors = [
    { name = "dana", email = "danahalzaghir@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "litellm>=1.106.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prelegal-backend = "prelegal_backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
